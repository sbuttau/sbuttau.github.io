cv:
  name: Sara Buttau
  label: Computer Scientist
  email: sara.buttau@phd.unipd.it
  location: Padua, Italy
  image: ""
  summary: >-
    Computer Vision PhD student at the University of Padua with an MSc in Computer Science. Experienced in developing deep learning models for
    real-world applications, including 2D and 3D human monitoring, visual phrase grounding and medical imaging. Currently, I am part of the
    Visual Intelligence and Machine Perception Group, supervised by Professor Lamberto Ballan, exploring 3D visual-language tasks for 3D scene
    understanding.

