    Experience:
      - company: EVS Embedded Vision Systems Srl, University of Verona
        position: Research Assistant
        location: Verona, Italy
        start_date: 2024-01
        end_date: 2025-10
        summary: I worked on several team projects concerning indoor human monitoring, spanning object detection, 2D/3D human pose estimation and mesh recovery, and 3D occupancy prediction.
        highlights:
          - Conducted quantization, optimization strategies and latency assessments to maximize performance within embedded environments
          - Communicated findings to clients and offered recommendations for future research directions
          - Represented the company at its industry exhibition booth at ECCV 2024 (Milan)

      - company: Visual Intelligence and Machine Perception Group (VIMP), University of Padua
        position: Research Intern
        location: Padua, Italy
        start_date: 2023-03
        end_date: 2023-09
        summary: This internship was the basis for my MSc dissertation, under the supervision of prof. Lamberto Ballan.
        highlights:
          - Approached the task of visual phrase grounding to align natural language phrases with specific objects in images, developing an unsupervised model focused on proposal generation
          - Investigated the effect of vocabulary size on zero-shot unsupervised visual grounding, using three state-of-the-art detectors
          - Explored alignment mechanisms for region-phrase pairs, improving matching between visual and textual elements

      - company: University of Cagliari
        position: Research Intern
        location: Cagliari, Italy
        start_date: 2020-03
        end_date: 2021-02
        summary: This internship was the basis for my BSc dissertation, supervised by prof. Cecilia Di Ruberto and dr. Andrea Loddo.
        highlights:
          - Developed diagnostic models for Alzheimer's disease and dementia stages from medical MRIs
          - Fine-tuned and cross-validated five CNN-based classification models on three datasets
          - Achieved state-of-the-art performance in binary and multiclass classification

